global
  daemon
  maxconn 256

defaults
  mode http
  timeout connect 5000ms
  timeout client 50000ms
  timeout server 50000ms

resolvers docker
  nameserver internal 127.0.0.11:53
  hold valid 10s

frontend wrenam
  bind :8080
  monitor-uri /monitor
  default_backend wrenam

backend wrenam
  balance roundrobin
  cookie amlbcookie indirect nocache
  option redispatch
  default-server check resolvers docker init-addr none
  server wrenam1.wrensecurity.test wrenam1.wrensecurity.test:8080 cookie 01 
  server wrenam2.wrensecurity.test wrenam2.wrensecurity.test:8080 cookie 03
